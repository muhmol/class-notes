<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3B3BF5" />
    <meta name="description" content="ثبت سریع آنچه سر کلاس گفته شد، با تاریخ و ساعت خودکار" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>یادداشت کلاس</title>
    <script>
      // Apply saved theme/direction before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('cn:settings') || '{}');
        var lang = s.lang === 'en' ? 'en' : 'fa';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
        if (s.theme === 'dark') document.documentElement.dataset.theme = 'dark';
        if (s.theme === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
